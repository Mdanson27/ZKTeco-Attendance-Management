<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoMinds Attendance OS</title><link rel="stylesheet" href="/workspace/styles.css"></head>
<body><aside><header><strong>AutoMinds Africa</strong><small>ATTENDANCE OS</small></header><nav id="nav" hidden><button data-page="overview">Overview</button><button data-page="attendance">Live attendance</button><button data-page="employees">Employees</button><button data-page="devices">Biometric devices</button><button data-page="reports">Reports & exports</button></nav><p class="muted">Secure workspace · Development</p></aside>
<main><div class="top"><span>Workforce management</span><button id="logout" hidden>Sign out</button></div>
<section id="login"><h1>Connect to your workspace</h1><p>Development access only. Enter a valid Neon Auth session token and your authorized organization ID. Full sign-in integration is pending.</p><form id="loginform"><label>Organization ID<input id="org" required autocomplete="off" placeholder="Organization UUID"></label><label>Session token<input id="token" required type="password" autocomplete="off"></label><button type="submit">Connect securely</button></form></section>
<section id="workspace" hidden><h1 id="title">Overview</h1><p id="status" role="status"></p><div id="filters" hidden><label>From (Kampala date)<input id="start" type="date"></label><label>Through (Kampala date)<input id="end" type="date"></label><button id="refresh">Refresh</button><button id="export">Export CSV</button><button id="prev">Previous</button><button id="next">Next</button></div><div id="content"></div></section><p id="error" role="alert"></p></main><script src="/workspace/app.js" defer></script></body></html>
